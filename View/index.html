<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="./styles/style.css">
</head>
<body>
    <div class="container">
        <h2>Criar Conta</h2>
        <form action="#" method="POST">
            <div class="input-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>
            </div>

            <div class="input-group">
                <label for="email">CPF</label>
                <input type="email" id="email" name="email" placeholder="Digite seu CPF" required>
            </div>
            
            <div class="input-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" placeholder="Crie uma senha" required>
            </div>

            <div class="input-group">
                <label for="senha">Repita a sua senha</label>
                <input type="password" id="senha" name="senha" placeholder="Repita a senha" required>
            </div>

            <button type="submit" class="btn-submit">Cadastrar</button>
            
            <p class="login-link">Já tem uma conta? <a href="./login.html">Fazer login</a></p>
        </form>
    </div>
</body>
</html>
